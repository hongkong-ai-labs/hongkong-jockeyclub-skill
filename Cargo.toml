[package]
name = "hongkong-jockeyclub-skill"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Hong Kong Jockey Club horse racing and Mark Six as a CLI and an MCP server"
license = "MIT"
repository = "https://github.com/hongkong-ai-labs/hongkong-jockeyclub-skill"
readme = "README.md"
keywords = ["hong-kong", "hkjc", "horse-racing", "mark-six", "mcp"]
categories = ["command-line-utilities"]

[lib]
name = "hkjc"
path = "src/lib.rs"

[[bin]]
name = "hkjc"
path = "src/main.rs"

[[bin]]
name = "hkjc-mcp"
path = "src/bin/hkjc-mcp.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "charset"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
